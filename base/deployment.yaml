# base/deployment.yaml

apiVersion: apps/v1

kind: Deployment

metadata:

  name: orders-app

spec:

  replicas: 1

  selector:

    matchLabels:

      app: orders-app

  template:

    metadata:

      labels:

        app: orders-app

    spec:

      containers:

      - name: orders

        image: nginx:1.25

        envFrom:

        - configMapRef:

            name: app-config
